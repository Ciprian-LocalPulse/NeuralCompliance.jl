name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SSH deploy key lets TagBot push the tag/release itself. Without
          # it, TagBot can still comment but cannot create the tag on a
          # protected default branch. Add a deploy key named TAGBOT_TOKEN's
          # companion secret (see JuliaRegistries/TagBot docs) if pushes are
          # rejected once branch protection is enabled.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
