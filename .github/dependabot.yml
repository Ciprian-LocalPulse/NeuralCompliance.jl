version: 2
updates:
  # Julia package dependencies (currently only SHA.jl, plus stdlib
  # deps which Dependabot will simply have nothing to report on).
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  # Keep the CI/Documentation GitHub Actions workflows themselves
  # up to date (actions/checkout, julia-actions/*, codecov-action, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
